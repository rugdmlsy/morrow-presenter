<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Morrow Presenter</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">Morrow Presenter</div>
    <input id="deck-title" class="deck-title" value="Untitled deck" aria-label="Deck title" />
    <div class="top-actions">
      <button id="undo" class="ghost" title="撤销 ⌘Z">↶</button>
      <button id="redo" class="ghost" title="重做 ⇧⌘Z">↷</button>
      <button id="new-deck" class="ghost">新建</button>
      <button id="open-deck" class="ghost">打开</button>
      <button id="save-deck" class="ghost">保存</button>
      <button id="save-as" class="ghost">另存为</button>
      <button id="export-pdf" class="ghost" title="导出 PDF">PDF</button>
      <button id="export-pptx" class="ghost" title="导出 PowerPoint">PPTX</button>
      <button id="present" class="primary">放映</button>
      <input id="import-file" type="file" accept="application/json,.json,.morrowdeck" hidden />
    </div>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="sidebar-head">
        <span>Slides</span>
        <button id="add-slide" class="icon-button" title="新增 slide">＋</button>
      </div>
      <div id="slide-list" class="slide-list"></div>
    </aside>

    <section class="editor-area">
      <div class="editor-toolbar main-toolbar">
        <label>布局
          <select id="layout-select">
            <option value="title-body">标题 + 正文</option>
            <option value="title">仅标题</option>
            <option value="section">章节页</option>
            <option value="blank">空白</option>
          </select>
        </label>
        <button id="insert-text" class="ghost">文本框</button>
        <select id="shape-kind" aria-label="形状类型" title="形状类型">
          <option value="rect">矩形</option>
          <option value="rounded-rect">圆角矩形</option>
          <option value="ellipse">椭圆</option>
          <option value="line">直线</option>
          <option value="arrow">箭头</option>
          <option value="triangle">三角形</option>
          <option value="diamond">菱形</option>
          <option value="pentagon">五边形</option>
          <option value="hexagon">六边形</option>
          <option value="star">五角星</option>
          <option value="chevron">V形箭头</option>
        </select>
        <button id="insert-shape" class="ghost">形状</button>
        <button id="choose-image" class="ghost">图片</button>
        <button id="insert-table" class="ghost">表格</button>
        <button id="connect-selected" class="ghost" title="连接两个已选对象">连接</button>
        <select id="slide-size" aria-label="幻灯片尺寸" title="幻灯片尺寸">
          <option value="wide">16:9 宽屏</option><option value="standard">4:3 标准</option>
        </select>
        <select id="theme-preset" aria-label="主题" title="应用主题到整份文稿">
          <option value="default">默认主题</option><option value="dark">深色主题</option><option value="warm">暖色主题</option><option value="blue">蓝色主题</option>
        </select>
        <button id="toggle-snap" class="ghost active" title="对象/参考线吸附">吸附</button>
        <button id="toggle-grid" class="ghost" title="显示网格并启用网格吸附">网格</button>
        <button id="toggle-guides" class="ghost active" title="显示中心参考线">参考线</button>
        <button id="toggle-element-labels" class="ghost" title="显示组件序号、类型和短 ID，便于指定 agent 修改">组件标识</button>
        <label class="compact-label" title="Slide 背景">背景 <input id="slide-background" type="color" value="#ffffff" /></label>
        <select id="slide-transition" aria-label="切换效果" title="切换效果">
          <option value="none">无切换</option>
          <option value="fade">淡入</option>
        </select>
        <button id="toggle-notes" class="ghost">备注</button>
        <input id="footer-text" class="footer-text-input" type="text" placeholder="页脚文字" title="全局页脚文字" />
        <button id="toggle-footer" class="ghost" title="显示/隐藏页脚文字">页脚</button>
        <button id="toggle-slide-number" class="ghost" title="显示/隐藏幻灯片页码">页码</button>
        <div class="toolbar-spacer"></div>
        <button id="duplicate-slide" class="ghost">复制页</button>
        <button id="delete-slide" class="danger-ghost">删除页</button>
      </div>

      <div id="object-toolbar" class="editor-toolbar object-toolbar">
        <span id="selection-count" class="selection-count">未选择对象</span>
        <select id="text-role" title="文本角色" aria-label="文本角色">
          <option value="none">普通文本</option><option value="title">标题</option><option value="body">正文</option>
        </select>
        <select id="font-family" title="字体" aria-label="字体">
          <option value="Inter">Inter</option>
          <option value="Arial">Arial</option>
          <option value="Helvetica">Helvetica</option>
          <option value="Georgia">Georgia</option>
          <option value="Times New Roman">Times New Roman</option>
          <option value="Courier New">Courier New</option>
        </select>
        <input id="font-size" class="number-control" type="number" min="4" max="300" step="1" value="28" title="字号" aria-label="字号" />
        <button id="text-bold" class="format-button" title="粗体 ⌘B"><b>B</b></button>
        <button id="text-italic" class="format-button" title="斜体 ⌘I"><i>I</i></button>
        <button id="text-underline" class="format-button" title="下划线 ⌘U"><u>U</u></button>
        <select id="text-align" title="文本对齐" aria-label="文本对齐">
          <option value="left">左对齐</option><option value="center">居中</option><option value="right">右对齐</option>
        </select>
        <select id="list-style" title="项目符号/编号" aria-label="列表样式">
          <option value="none">无列表</option><option value="bullet">• 项目符号</option><option value="number">1. 编号</option>
        </select>
        <input id="line-spacing" class="number-control narrow" type="number" min="0.7" max="4" step="0.1" value="1.2" title="行距倍数" aria-label="行距" />
        <input id="paragraph-spacing" class="number-control narrow" type="number" min="0" max="72" step="1" value="0" title="段后距 pt" aria-label="段后距" />
        <input id="text-indent" class="number-control narrow" type="number" min="0" max="120" step="2" value="0" title="段落缩进 pt" aria-label="段落缩进" />
        <button id="text-autofit" class="compact-button" title="文字过多时自动缩小字号">自动适应</button>
        <label class="color-control" title="文字颜色">A <input id="text-color" type="color" value="#202124" /></label>
        <label class="color-control" title="填充颜色">填 <input id="object-fill" type="color" value="#e8e8e4" /></label>
        <button id="no-fill" class="compact-button" title="无填充">无填充</button>
        <label class="color-control" title="边框颜色">线 <input id="object-stroke" type="color" value="#4b4d50" /></label>
        <button id="no-stroke" class="compact-button" title="无边框">无线</button>
        <input id="stroke-width" class="number-control narrow" type="number" min="0" max="20" step="0.5" value="1.5" title="线宽" aria-label="线宽" />
        <label class="geometry-control" title="X 位置 %">X <input id="geometry-x" class="number-control narrow" type="number" step="0.1" /></label>
        <label class="geometry-control" title="Y 位置 %">Y <input id="geometry-y" class="number-control narrow" type="number" step="0.1" /></label>
        <label class="geometry-control" title="宽度 %">W <input id="geometry-width" class="number-control narrow" type="number" min="0.5" step="0.1" /></label>
        <label class="geometry-control" title="高度 %">H <input id="geometry-height" class="number-control narrow" type="number" min="0.5" step="0.1" /></label>
        <button id="flip-h" class="compact-button" title="水平翻转">↔翻转</button>
        <button id="flip-v" class="compact-button" title="垂直翻转">↕翻转</button>
        <input id="rotation" class="number-control narrow" type="number" step="1" value="0" title="旋转角度" aria-label="旋转角度" />
        <input id="opacity" class="number-control narrow" type="number" min="0" max="100" step="5" value="100" title="透明度 %" aria-label="透明度" />
        <button id="crop-toggle" class="compact-button" title="非破坏性裁切">裁切</button>
        <button id="crop-reset" class="compact-button" title="重置裁切">重置</button>
        <select id="connector-arrow" title="连接符箭头" aria-label="连接符箭头">
          <option value="none">无线头</option><option value="end">单箭头</option><option value="both">双箭头</option>
        </select>
        <button id="connector-dash" class="compact-button" title="连接符虚线">虚线</button>
        <select id="object-order" title="层级" aria-label="层级">
          <option value="">层级</option><option value="front">置于顶层</option><option value="forward">上移一层</option><option value="backward">下移一层</option><option value="back">置于底层</option>
        </select>
        <select id="object-align" title="对齐/分布" aria-label="对齐/分布">
          <option value="">对齐</option><option value="left">左</option><option value="center">水平居中</option><option value="right">右</option><option value="top">顶端</option><option value="middle">垂直居中</option><option value="bottom">底端</option><option value="distribute-h">水平分布</option><option value="distribute-v">垂直分布</option>
        </select>
        <button id="table-row-add" class="compact-button" title="表格增加一行">+行</button>
        <button id="table-row-delete" class="compact-button" title="表格删除末行">-行</button>
        <button id="table-col-add" class="compact-button" title="表格增加一列">+列</button>
        <button id="table-col-delete" class="compact-button" title="表格删除末列">-列</button>
        <button id="group-objects" class="compact-button" title="组合所选对象 ⌘G">组合</button>
        <button id="ungroup-objects" class="compact-button" title="取消组合 ⇧⌘G">取消组合</button>
        <button id="lock-object" class="compact-button" title="锁定/解锁">锁定</button>
        <button id="duplicate-object" class="compact-button" title="复制对象 ⌘D">复制对象</button>
        <button id="delete-object" class="danger-ghost compact-button" title="删除对象">删除对象</button>
      </div>

      <div class="canvas-stage">
        <div id="slide-canvas" class="slide-canvas" aria-label="Slide editor"></div>
      </div>

      <div id="notes-panel" class="notes-panel" hidden>
        <span>演讲者备注</span>
        <textarea id="slide-notes" placeholder="仅演讲者可见的备注…"></textarea>
      </div>

      <div class="statusbar">
        <span id="save-status">未保存 · ⌘S 保存</span>
        <span id="object-status"></span>
        <span id="slide-position"></span>
        <span class="shortcut-hint">⇧/⌘ 多选 · ⌘C/V · ⌘D · Delete · ⌘Z · ⌘↵ 放映</span>
      </div>
    </section>
  </main>

  <div id="presentation" class="presentation" hidden>
    <div id="presentation-slide" class="presentation-slide"></div>
    <button id="exit-presentation" class="presentation-close" aria-label="退出放映">×</button>
    <div class="presentation-footer">
      <span id="presentation-counter"></span>
      <div class="presentation-progress"><div id="presentation-progress-bar"></div></div>
      <span>← → / Space 翻页 · Esc 退出</span>
    </div>
  </div>

  <script src="./app.js"></script>
</body>
</html>
